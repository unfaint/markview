name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Android ──────────────────────────────────────────────────────────────
  release-android:
    name: Release Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --no-pub
      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: markview ${{ github.ref_name }}
          draft: true

  # ── Web ───────────────────────────────────────────────────────────────────
  release-web:
    name: Deploy Web to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /markview/ --no-pub
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - uses: actions/deploy-pages@v4
        id: deployment

  # ── Linux ─────────────────────────────────────────────────────────────────
  release-linux:
    name: Release Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libblkid-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --no-pub
      - name: Archive Linux build
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../markview-linux-x64.tar.gz .
      - uses: softprops/action-gh-release@v2
        with:
          files: markview-linux-x64.tar.gz
          draft: true

  # ── macOS ─────────────────────────────────────────────────────────────────
  release-macos:
    name: Release macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --no-pub
      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "markview" \
            --window-size 600 400 \
            --app-drop-link 400 200 \
            markview-macos.dmg \
            "build/macos/Build/Products/Release/markview.app"
      - uses: softprops/action-gh-release@v2
        with:
          files: markview-macos.dmg
          draft: true

  # ── Windows ───────────────────────────────────────────────────────────────
  release-windows:
    name: Release Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --no-pub
      - name: Archive Windows build
        run: |
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath markview-windows-x64.zip
        shell: pwsh
      - uses: softprops/action-gh-release@v2
        with:
          files: markview-windows-x64.zip
          draft: true
